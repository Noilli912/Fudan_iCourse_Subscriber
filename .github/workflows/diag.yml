name: Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pycryptodome pyotp

      - name: Run diag
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          COURSE_IDS: ${{ secrets.COURSE_IDS }}
        run: python scripts/diag_video.py
